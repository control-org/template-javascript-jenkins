sonar.projectKey=template-javascript-jenkins
sonar.projectName=template-javascript-jenkins
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=**/*.test.js
sonar.exclusions=**/node_modules/**,**/coverage/**,eslint.config.mjs
sonar.coverage.exclusions=**/*.test.js,tests/**
